<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sağlıktan – Hastalık Toplulukları için Destek Platformu</title>
    <meta name="description" content="Kronik ve nadir hastalıklarla yaşayan bireyleri ve yakınlarını hastalık gruplarında bir araya getiren, deneyim paylaşımına dayalı güvenli bir topluluk platformu." />
    <meta name="theme-color" content="#1E1A16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Faz6: açık tema desteği - React yüklenip AccessibilityProvider
         çalışana kadar body varsayılan (koyu) zeminle boyanır, kullanıcı
         açık temayı seçmişse bir anlığına koyu-sonra-açık "flaş" (FOUC)
         görülür. Bunu önlemek için localStorage'daki tercih, herhangi bir
         CSS/React kodu çalışmadan ÖNCE senkron biçimde okunup <html>'e
         data-theme olarak yazılıyor - bkz. index.css'teki
         html[data-theme='light'] body kuralı ve AccessibilityContext.jsx'in
         aynı STORAGE_KEY'i kullanan kalıcı tercih mekanizması. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sagliktan:accessibility');
          var mode = raw && JSON.parse(raw).themeMode === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Safari'den "Ana Ekrana Ekle" ile açılınca tarayıcı arayüzü (adres
         çubuğu vb.) olmadan, gerçek bir uygulama gibi tam ekran çalışsın.
         viewport-fit=cover + bu etiketler olmadan iOS bunu sadece bir
         Safari kısayolu olarak açar, uygulama gibi görünmez. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sağlıktan" />
    <!-- Inter fontu artık Google'ın sunucusundan değil, @fontsource/inter ile
         yerelden (self-hosted) yükleniyor - bkz. src/main.jsx. İki sebep:
         1) KVKK/GDPR: Google Fonts'u doğrudan Google'dan çekmek, kullanıcının
            IP adresini rızası olmadan Google'a göndermek anlamına geliyor

            geciktirip Playwright testlerinin deterministik biçimde
            timeout'a düşmesine sebep oluyordu (bkz. E2E #4 teşhis raporu). -->
  </head>
