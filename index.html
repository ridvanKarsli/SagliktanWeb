<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sağlıktan – Hastalık Toplulukları için Destek Platformu</title>
    <meta name="description" content="Kronik ve nadir hastalıklarla yaşayan bireyleri ve yakınlarını hastalık gruplarında bir araya getiren, deneyim paylaşımına dayalı güvenli bir topluluk platformu." />
    <meta name="theme-color" content="#F2F7F4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Faz6: açık tema desteği - React yüklenip AccessibilityProvider
         çalışana kadar body varsayılan (koyu) zeminle boyanır, kullanıcı
         açık temayı seçmişse bir anlığına koyu-sonra-açık "flaş" (FOUC)
         görülür. Bunu önlemek için localStorage'daki tercih, herhangi bir
         CSS/React kodu çalışmadan ÖNCE senkron biçimde okunup <html>'e
         data-theme olarak yazılıyor - bkz. index.css'teki
         html[data-theme='light'] body kuralı ve AccessibilityContext.jsx'in
         aynı STORAGE_KEY'i kullanan kalıcı tercih mekanizması. -->
    <!-- Inline <script> DEĞİL, harici dosya: vercel.json'daki CSP
         `script-src 'self'` inline script'e izin vermiyor, bu yüzden prod'da
         bu kod hiç çalışmıyor ve açık tema kullanıcıları tam da önlenmek
         istenen koyu->açık flaşı görüyordu (vite preview'da CSP olmadığı
         için CI'da fark edilmiyordu). Harici, senkron (defer/async YOK)
         script aynı "React'ten önce çalış" garantisini CSP'ye uyarak verir. -->
    <script src="/theme-init.js"></script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Safari'den "Ana Ekrana Ekle" ile açılınca tarayıcı arayüzü (adres
         çubuğu vb.) olmadan, gerçek bir uygulama gibi tam ekran çalışsın.
         viewport-fit=cover + bu etiketler olmadan iOS bunu sadece bir
         Safari kısayolu olarak açar, uygulama gibi görünmez. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sağlıktan" />
    <!-- Fontlar (Nunito, Baloo 2) kendi sunucumuzdan yükleniyor - bkz.
         src/main.jsx. KVKK: Google Fonts'a doğrudan istek kullanıcının IP
         adresini rızası olmadan Google'a gönderir; ayrıca harici,
         render'ı bekleten bir istek ilk boyamayı geciktirir. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
