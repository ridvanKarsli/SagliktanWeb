name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Playwright testleri gerçek bir tarayıcıda, gerçek backend + Postgres'e
    # karşı çalışıyor - bu yüzden bu job hem frontend'i (bu repo) hem de
    # backend'i (ridvanKarsli/sagliktan-api, public repo) checkout edip
    # ikisini birden ayağa kaldırıyor. Sadece frontend build/lint için ayrı
    # bir CI'ya gerek yok, çünkü bu workflow zaten frontend'i de build edip
    # çalıştırıyor - build hata verirse Playwright adımı zaten patlar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sagliktan
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Frontend checkout
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Backend checkout
        uses: actions/checkout@v4
        with:
          repository: ridvanKarsli/sagliktan-api
          path: backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend'i derle (testsiz - testler backend kendi CI'sında zaten çalışıyor)
        working-directory: backend
        run: ./mvnw -B -DskipTests clean package

      - name: Backend'i başlat
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sagliktan
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          APP_JWT_SECRET: Y2ktb25seS10ZXN0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q9
          EMAIL_SENDER: ci-test@example.com
          EMAIL_PASSWORD: ci-test-password
          APP_BASE_URL: http://localhost:8080
          # SADECE burada, E2E ortamında true - Playwright gerçek bir e-posta
          # kutusu okuyamadığı için kayıt anında otomatik doğrulama gerekiyor.
          # Bkz. AuthServiceImpl.autoVerifyEmail. Prod/staging'de bu değişken
          # asla tanımlanmamalı.
          APP_TESTING_AUTO_VERIFY_EMAIL: "true"
          # SADECE burada - bu önekle başlayan e-postayla kayıt olan test
          # kullanıcısı otomatik ADMIN rolüyle oluşturulur (bkz.
          # AuthServiceImpl.register). helpers.js#uniqueAdminUser bu öneki
          # kullanıyor. Prod/staging'de bu değişken asla tanımlanmamalı.
          APP_TESTING_AUTO_ADMIN_EMAIL_PREFIX: "e2e-admin."
          # SADECE burada - tek bir CI job'ında art arda çok sayıda test
          # kullanıcısı kayıt/login olduğu için IP bazlı rate limiter (bkz.
          # RateLimitFilter) gerçek bir saldırı sanıp "Çok fazla istek
          # gönderildi" ile testleri düşürüyordu. Limitleri kaldırmak yerine
          # 1000x'e katlıyoruz - üretimdeki güvenlik davranışı bu değişken
          # tanımlanmadığı sürece (yani her zaman, prod dahil) birebir aynı.
          APP_TESTING_RATE_LIMIT_MULTIPLIER: "1000"
        run: |
          nohup java -jar target/*.jar > backend.log 2>&1 &
          echo "Backend başlatıldı, health check bekleniyor..."

      - name: Backend health check bekle
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Backend ayakta."
              exit 0
            fi
            echo "Bekleniyor... ($i/30)"
            sleep 2
          done
          echo "Backend zamanında ayağa kalkmadı, log:"
          cat backend/backend.log
          exit 1

      - name: Frontend bağımlılıklarını kur
        working-directory: frontend
        run: npm ci

      - name: Playwright tarayıcılarını kur
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: E2E testlerini çalıştır (kritik akışlar)
        working-directory: frontend
        env:
          CI: true
          # KRİTİK: playwright.config.js'in webServer'ı burada "vite build &&
          # vite preview" çalıştırıyor - yani PROD build. notificationSocket.js
          # WS URL'ini import.meta.env.DEV'e göre seçiyor ve DEV=false olduğu
          # için (build-time flag, "vite preview" runtime'ıyla ilgisi yok) bu
          # değişken olmadan gerçek production'a (wss://api.sagliktan.com/ws)
          # bağlanmaya çalışırdı - CI'daki local backend'e değil. Sonuç: bildirim
          # WS push'ları hiç bu tarayıcıya ulaşmıyordu, badge hep "0" kalıp
          # notifications.spec.js testleri 10s timeout'ta başarısız oluyordu
          # (bkz. 2026-07-28 playwright-report + backend log analizi).
          VITE_WS_BASE: "ws://localhost:8080/ws"
        # "Görsel regresyon" (visual.spec.js) burada bilerek DIŞLANIYOR - baseline
        # PNG'ler şu ana kadar sadece macOS'ta üretildi (bkz. e2e/visual.spec.js-
        # snapshots/*-darwin.png), ama bu job Linux runner'da çalışıyor ve
        # Playwright, font rendering farkları yüzünden platforma özgü snapshot
        # adları kullanıyor (*-linux.png). Linux baseline'ı hiç yokken bu testler
        # "no baseline" ile HER SEFERİNDE başarısız oluyordu ve maxFailures=3'ü
        # doldurup asıl kritik testlerin (reaksiyon, bildirim, admin...) hiç
        # çalışmamasına yol açıyordu - bkz. 2026-08-05 CI run analizi. Aşağıdaki
        # ayrı, bloke etmeyen adımda görünürlük için yine de çalıştırılıyor.
        run: npx playwright test --grep-invert "Görsel regresyon"

      - name: Görsel regresyon (bilgilendirme amaçlı - Linux baseline henüz yok)
        working-directory: frontend
        continue-on-error: true
        env:
          CI: true
          VITE_WS_BASE: "ws://localhost:8080/ws"
          # Kritik akışlar adımının playwright-report/'unu ezmesin diye ayrı
          # klasörlere yazıyor - ikisi de aşağıda ayrı artifact olarak yükleniyor.
          PLAYWRIGHT_HTML_REPORT: playwright-report-visual
        run: npx playwright test --grep "Görsel regresyon" --output=test-results-visual

      - name: Playwright raporunu yükle (kritik akışlar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Playwright raporunu yükle (görsel regresyon)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            frontend/playwright-report-visual/
            frontend/test-results-visual/
          retention-days: 14

      - name: Backend log'unu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7
